<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff334b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title & Metadata -->
  <text x="30" y="38" fill="#ffffff" font-size="18" font-weight="700">SUSTAINABLE MICRO WIND TURBINE HARVESTER (SG-WIND-006)</text>
  <text x="30" y="60" fill="#8b949e" font-size="12">ELECTRICAL RECTIFICATION &amp; 5.0V BUCK REGULATION SCHEMATIC // AUTHOR: SURESH GANESEN</text>

  <!-- Block 1: AC Dynamo -->
  <g transform="translate(30, 90)">
    <rect width="180" height="180" rx="8" fill="url(#gradBlue)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="32" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">CORELESS DYNAMO</text>
    <circle cx="90" cy="85" r="32" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="90" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">M ~</text>
    <text x="90" y="138" fill="#e6edf3" font-size="11" text-anchor="middle">Wild AC: 2.0V - 18.0V</text>
    <text x="90" y="156" fill="#8b949e" font-size="10" text-anchor="middle">Cut-In @ 2.2 m/s</text>
  </g>

  <!-- Connecting Lines to Rectifier -->
  <line x1="210" y1="150" x2="260" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <line x1="210" y1="210" x2="260" y2="210" stroke="#38bdf8" stroke-width="2"/>

  <!-- Block 2: Schottky Rectifier -->
  <g transform="translate(260, 90)">
    <rect width="200" height="180" rx="8" fill="url(#gradRed)" stroke="#ff334b" stroke-width="1.5"/>
    <text x="100" y="32" fill="#ff334b" font-size="13" font-weight="700" text-anchor="middle">SCHOTTKY FULL-BRIDGE</text>
    <text x="100" y="52" fill="#8b949e" font-size="10" text-anchor="middle">4x 1N5819 (Vf = 0.32V)</text>
    
    <!-- Bridge Diamond -->
    <polygon points="100,75 140,115 100,155 60,115" fill="none" stroke="#ff334b" stroke-width="1.5"/>
    <text x="100" y="119" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">DIODE</text>
    <text x="100" y="172" fill="#e6edf3" font-size="10" text-anchor="middle">Conduction Drop: 0.64V</text>
  </g>

  <!-- Filter Cap -->
  <line x1="460" y1="130" x2="520" y2="130" stroke="#22c55e" stroke-width="2"/>
  <line x1="460" y1="230" x2="520" y2="230" stroke="#8b949e" stroke-width="2"/>
  <g transform="translate(480, 150)">
    <line x1="10" y1="-20" x2="10" y2="10" stroke="#22c55e" stroke-width="2"/>
    <line x1="10" y1="50" x2="10" y2="80" stroke="#8b949e" stroke-width="2"/>
    <rect x="0" y="10" width="20" height="40" rx="3" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="10" y="35" fill="#22c55e" font-size="9" font-weight="700" text-anchor="middle">1000uF</text>
  </g>

  <!-- Block 3: Synchronous Buck Regulator -->
  <g transform="translate(520, 90)">
    <rect width="180" height="180" rx="8" fill="url(#gradGreen)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="90" y="32" fill="#22c55e" font-size="13" font-weight="700" text-anchor="middle">BUCK CONVERTER</text>
    <text x="90" y="52" fill="#8b949e" font-size="10" text-anchor="middle">LM2596 / MP1584</text>
    
    <rect x="25" y="75" width="130" height="50" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="90" y="98" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">PWM REGULATOR</text>
    <text x="90" y="115" fill="#8b949e" font-size="10" text-anchor="middle">Efficiency: ~92%</text>

    <text x="90" y="152" fill="#ffffff" font-size="11" text-anchor="middle">Vin: 4.5V - 28.0V</text>
    <text x="90" y="170" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">Vout: Fixed 5.00V DC</text>
  </g>

  <!-- Block 4: Regulated 5V Output -->
  <line x1="700" y1="140" x2="740" y2="140" stroke="#ff334b" stroke-width="2.5"/>
  <line x1="700" y1="220" x2="740" y2="220" stroke="#8b949e" stroke-width="2.5"/>
  <g transform="translate(740, 105)">
    <rect width="130" height="150" rx="8" fill="#1e293b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="65" y="32" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">USB 5V OUT</text>
    <rect x="35" y="50" width="60" height="30" rx="3" fill="#0f172a" stroke="#ffffff" stroke-width="1.2"/>
    <text x="65" y="70" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">USB-A</text>
    
    <text x="65" y="105" fill="#4ade80" font-size="13" font-weight="700" text-anchor="middle">5.0V / 350mA</text>
    <text x="65" y="125" fill="#8b949e" font-size="9.5" text-anchor="middle">IoT &amp; Mobile Ready</text>
  </g>
</svg>
